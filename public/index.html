<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Gestão</title>
<meta name="theme-color" content="#090E1A">
<script src="js/core/theme-init.js"></script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235B7CFA'/%3E%3Ctext x='16' y='21' font-family='monospace' font-size='13' font-weight='700' text-anchor='middle' fill='%230B1220'%3EGP%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip-link" href="#content">Pular para o conteúdo</a>

<div class="app">

  <aside class="sidebar" aria-label="Menu principal">
    <div class="brand">
      <span class="brand-mark" id="brandMark">GP</span>
      <div class="brand-text">
        <strong id="brandName">Painel de Gestão</strong>
        <span id="brandSub">operação &amp; serviços</span>
      </div>
      <button type="button" class="nav-toggle" id="navToggle" aria-label="Abrir menu">☰</button>
    </div>

    <nav class="nav" id="nav" aria-label="Telas"></nav>

    <div class="sidebar-foot">
      <button type="button" class="reset-btn" id="resetData" hidden>↺ Restaurar dados de exemplo</button>
      <span class="app-version" id="appVersion"></span>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-title">
        <nav class="crumbs" id="crumbs" aria-label="Você está em"></nav>
        <div class="title-row">
          <h1 id="viewTitle">Carregando…</h1>
          <span class="access-pill" id="accessPill" hidden>Somente consulta</span>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="search-trigger" id="searchBtn" type="button" aria-label="Buscar tela">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="9" cy="9" r="5.5"/><path d="m13.2 13.2 3.3 3.3"/></svg>
          <span class="st-label">Buscar tela…</span><kbd id="searchKbd">Ctrl K</kbd>
        </button>
        <div class="export-menu" id="exportMenu" hidden>
          <button class="btn btn-ghost export-trigger" id="exportBtn" type="button" aria-haspopup="true" aria-expanded="false" title="Exportar os dados desta tela">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3v9.5M6 9l4 4 4-4"/><path d="M3.5 14.5v2h13v-2"/></svg>
            <span class="tt-label">Exportar</span>
          </button>
          <div class="user-pop export-pop" id="exportPop" hidden>
            <div class="user-pop-head"><strong>Exportar esta tela</strong><span>Com os filtros e a ordenação aplicados</span></div>
            <button type="button" data-export="pdf">PDF <small>para imprimir ou enviar</small></button>
            <button type="button" data-export="excel">Excel (.xlsx) <small>para editar e somar</small></button>
          </div>
        </div>
        <button class="icon-toggle" id="themeToggle" type="button" aria-label="Alternar tema claro/escuro">
          <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <div class="user-menu" id="userMenu" hidden>
          <button class="user-chip" id="userChip" type="button" aria-haspopup="true" aria-expanded="false">
            <span class="user-avatar" id="userAvatar"></span>
            <span class="user-name" id="userName"></span>
          </button>
          <div class="user-pop" id="userPop" hidden>
            <div class="user-pop-head"><strong id="userPopName"></strong><span id="userPopEmail"></span><em class="user-role" id="userPopRole"></em></div>
            <button type="button" id="changePassword">Alterar senha</button>
            <button type="button" id="logoutBtn">Sair</button>
          </div>
        </div>
      </div>
    </header>

    <main class="content" id="content" tabindex="-1"></main>
  </div>

</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h3 id="modalTitle">Novo registro</h3>
      <button type="button" class="modal-close" id="modalClose" aria-label="Fechar">×</button>
    </div>
    <form id="modalForm"></form>
  </div>
</div>

<div class="confirm-backdrop" id="confirmBox" hidden>
  <div class="confirm" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmMsg">
    <h3 id="confirmTitle"></h3>
    <p id="confirmMsg"></p>
    <div class="confirm-actions">
      <button type="button" class="btn" id="confirmCancel">Cancelar</button>
      <button type="button" class="btn btn-primary" id="confirmOk">Confirmar</button>
    </div>
  </div>
</div>

<div class="palette-backdrop" id="palette" hidden>
  <div class="palette" role="dialog" aria-modal="true" aria-label="Buscar tela">
    <div class="palette-input">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="9" cy="9" r="5.5"/><path d="m13.2 13.2 3.3 3.3"/></svg>
      <input id="paletteInput" type="text" placeholder="Ir para… (digite o nome da tela)" autocomplete="off" aria-label="Nome da tela">
      <kbd>Esc</kbd>
    </div>
    <ul class="palette-list" id="paletteList" role="listbox"></ul>
    <div class="palette-foot"><span><kbd>↑</kbd><kbd>↓</kbd> navegar</span><span><kbd>Enter</kbd> abrir</span></div>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="js/core/icons.js"></script>
<script src="js/core/util.js"></script>
<script src="js/core/api.js"></script>
<script src="js/core/export.js"></script>
<script src="js/views/tabela.js"></script>
<script src="js/views/home.js"></script>
<script src="js/views/kanban.js"></script>
<script src="js/views/relatorios.js"></script>
<script src="js/views/sla.js"></script>
<script src="js/views/agenda.js"></script>
<script src="js/views/admin.js"></script>
<script src="js/app.js"></script>
</body>
</html>
